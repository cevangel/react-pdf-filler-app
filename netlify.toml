# Vite writes the site to client-vite/dist. Publish directory is set in Netlify UI:
# Base directory = client-vite, Publish directory = dist (not client-vite/dist).
#
# Optional: clear "Package directory" in Netlify if it duplicates base — can confuse paths.
[build]
  base = "client-vite"
  command = "npm install && npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
